<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>resonating loop</title>
  <meta name="description" content="maria colette / resonating loop" />

  <!--
    Fonts. Two families, chosen against the brief (occult-technical, "an
    instrument that's faintly listening back"):
      · Cormorant Garamond — high-contrast, ethereal serif for the names.
        The thin weights read ritual/oracular without tipping into goth.
      · IBM Plex Mono — the instrument readout. Labels, call-sign, links.
        Mono = "omens off stack traces" energy, the machine half of the page.
    To swap the whole mood, change these two <link>s and the --font-* tokens.
  -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;1,300;1,400&family=IBM+Plex+Mono:wght@300;400;500&display=swap" rel="stylesheet" />

  <link rel="stylesheet" href="style.css" />
</head>

<body>
  <!--
    The whole page is one "plate" — an instrument face on a dark desert
    night. Registration ticks in the corners frame it like a map cartouche
    or a theodolite's reticle.
  -->
  <main class="plate">

    <!-- cartographic corner registration marks (decorative) -->
    <span class="tick tick--tl" aria-hidden="true"></span>
    <span class="tick tick--tr" aria-hidden="true"></span>
    <span class="tick tick--bl" aria-hidden="true"></span>
    <span class="tick tick--br" aria-hidden="true"></span>

    <section class="identity">

      <!--
        The signature motif: concentric resonance rings, the banner's
        radiating-compass made literal. STATIC in this slice (slice 1);
        slice 2 makes them breathe and answer the cursor. Kept as inline
        SVG so the strokes stay crisp and JS can grab #rings later.
      -->
      <svg id="rings" class="rings" viewBox="-200 -200 400 400" aria-hidden="true">
        <!-- the whole reticle is wrapped so main.js can clone it into faint,
             lagging GHOST copies behind this live one — phosphor persistence. -->
        <g id="reticle" class="reticle">
          <g class="rings__group">
            <circle r="40"  />
            <circle r="78"  />
            <circle r="116" />
            <circle r="154" />
            <circle r="192" />
          </g>
          <!-- the radiating spokes of a compass/theodolite reticle -->
          <g class="rings__spokes">
            <line x1="0" y1="-196" x2="0" y2="196" />
            <line x1="-196" y1="0" x2="196" y2="0" />
            <line x1="-139" y1="-139" x2="139" y2="139" />
            <line x1="-139" y1="139" x2="139" y2="-139" />
          </g>
          <!-- the hot point: where the instrument is driven into the ground -->
          <circle class="rings__core" r="4" />
        </g>
      </svg>

      <div class="identity__text">
        <h1 class="name">maria&nbsp;colette</h1>
        <p class="callsign">
          <span class="callsign__glyph" aria-hidden="true">◎</span>
          the&nbsp;loop&nbsp;resonates
        </p>
      </div>

      <!--
        TWO-LINER SLOT — maria drafts this. Two lines of presence; whatever
        a stranger should read about you. Placeholder copy below is mine,
        meant to be torn up.
      -->
      <p class="bio" data-slot="bio">
        <span class="bio__firstline">ritual interfaces for uncertain entities</span>
        <span class="bio__secondline">quod&nbsp;·&nbsp;resonat&nbsp;·&nbsp;sequor</span>
      </p>

      <!--
        Channels. Links rendered as instrument readouts rather than a list:
        a mono label + a small glyph, like ports on a console.
        instagram is the occult-facing mask (reverse.oracle), deliberately
        the one handle that isn't "resonatingloop".
      -->
      <nav class="channels" aria-label="elsewhere">
        <a class="channel" href="https://github.com/resonatingloop" target="_blank" rel="me noopener">
          <span class="channel__glyph" aria-hidden="true">⌗</span>
          <span class="channel__label">github</span>
        </a>
        <a class="channel" href="https://substack.com/@resonatingloop" target="_blank" rel="me noopener">
          <span class="channel__glyph" aria-hidden="true">¶</span>
          <span class="channel__label">substack</span>
        </a>
        <a class="channel" href="https://x.com/resonatingloop" target="_blank" rel="me noopener">
          <span class="channel__glyph" aria-hidden="true">✕</span>
          <span class="channel__label">twitter</span>
        </a>
        <a class="channel" href="https://instagram.com/reverse.oracle" target="_blank" rel="me noopener">
          <span class="channel__glyph" aria-hidden="true">◑</span>
          <span class="channel__label">instagram</span>
        </a>
        <a class="channel" href="mailto:resonatingloop@cyphers.news" rel="me">
          <span class="channel__glyph" aria-hidden="true">✉</span>
          <span class="channel__label">mail</span>
        </a>
      </nav>

    </section>

  </main>

  <!-- slice 2: the rings listen + answer. defer so the page paints first. -->
  <script src="main.js" defer></script>
</body>
</html>
